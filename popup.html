<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: Arial, sans-serif; width: 320px; padding: 12px; }
    textarea { width: 100%; height: 80px; }
    input, button { width: 100%; padding: 8px; margin: 6px 0; }
    .hint { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h3>AutoFill Google Form (testing)</h3>
  <label>OpenAI API Key</label>
  <input id="apiKey" placeholder="sk-..." />
  <label>Mode</label>
  <select id="mode">
    <option value="suggest">Suggest (fill but don't submit)</option>
    <option value="fill">Fill (do not submit)</option>
    <option value="fill_and_submit">Fill & submit (use with care)</option>
  </select>
  <button id="start">Start Autofill on Active Form</button>
  <div class="hint">Ekstensi ini hanya bekerja pada halaman Google Forms. Pastikan form milikmu atau dummy.</div>
  <script src="popup.js"></script>
</body>
</html>
